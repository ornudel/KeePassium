name: Build KeePassium IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build App
        run: |
          xcodebuild clean build \
            -workspace KeePassium.xcworkspace \
            -scheme KeePassium \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r DerivedData/Build/Products/Release-iphoneos/KeePassium.app build/Payload/
          cd build
          zip -r KeePassium.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeePassium-unsigned-ipa
          path: build/KeePassium.ipa
